<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Lift</title>
  <meta name="description" content="A minimal workout tracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lift">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/screens.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <main id="tabs"></main>
    <button id="mini" class="mini" aria-label="Resume workout"></button>
    <nav id="tabbar" class="tabbar"></nav>
    <div id="workout" class="workout" role="dialog" aria-label="Workout"></div>
    <div id="sheets"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>
  <noscript>Lift needs JavaScript.</noscript>
</body>
</html>
